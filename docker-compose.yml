version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ai-content-backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/chroma_data
      - sqlite_data:/app/data
      - synced_images:/app/static/yandex_sync
      - ./backend/static:/app/static
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  frontend:
    build: ./frontend
    container_name: ai-content-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend_data:
  sqlite_data:
  synced_images:
  ollama_data:

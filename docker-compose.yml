version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ai-content-backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/chroma_data
      - ./backend/app.db:/app/app.db
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: ./frontend
    container_name: ai-content-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  backend_data:
